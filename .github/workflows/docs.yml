name: Docs

# No `release` trigger here on purpose. Tags are always cut from main, so the
# push that produced the tagged commit has already built and deployed exactly
# these docs. Worse, a release-triggered run builds the tag ref, and the
# github-pages environment only permits deployments from `main` — so it burned
# ~9 minutes of macOS runner and then failed at deploy, every time.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes landing on main minutes apart otherwise race, and the deploy that
# finishes last wins regardless of which commit is newer. One pending run per
# group means the newest queued build is the one that lands; in-progress
# deploys are left to finish rather than being half-applied.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - uses: nttld/setup-ndk@aacaf74664d0f8e1b070a865acb47ee25007386d # v1.6.0
        with:
          ndk-version: r28
          link-to-sdk: true

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - run: ./gradlew dokkaGenerate

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dokka-html
          path: build/dokka/html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/dokka/html

  # Two things have to be true for this to work. GitHub Pages on a private repo
  # requires GitHub Enterprise, hence the guard below — it kept this job skipped
  # for every run before the repo went public. And Pages has to be enabled on the
  # repo with "GitHub Actions" as the source, under Settings -> Pages; without
  # that, actions/deploy-pages fails with a 404 from the deployments API.
  # Either way, the `dokka-html` artifact uploaded above is a standalone way to
  # fetch the generated docs.
  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
