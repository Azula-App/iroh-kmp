name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Just the Rust crate, host-only: the full Gradle build needs an iOS
  # target (macOS-only toolchain) and the Android NDK, which are covered by
  # the macOS runners in publish.yml/docs.yml instead. Keeping CI to
  # `cargo test`/`cargo clippy` on Linux gives fast feedback on every PR.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - run: cargo test

      - run: cargo clippy -- -D warnings
