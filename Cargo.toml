[package]
name = "iroh-kmp"
version = "0.1.0"
edition = "2021"
publish = false
description = "Minimal UniFFI wrapper around iroh for Kotlin Multiplatform (Gobley/JNI bindings)."
license = "MIT OR Apache-2.0"

[lib]
name = "iroh_kmp"
crate-type = ["cdylib", "staticlib"]
path = "src/commonMain/rust/lib.rs"

[dependencies]
uniffi = { version = "0.29.4", features = ["tokio"] }
iroh = "1.0.0"
iroh-tickets = "1.0.0"
tokio = { version = "1", features = ["full"] }
thiserror = "2.0"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.21"

[profile.release]
lto = true
